<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/navbar.css" type="text/css" />
    <link rel="stylesheet" href="css/common.css" type="text/css" />
    <link rel="stylesheet" href="css/footer.css" type="text/css" />
    <title>IT's KOSTA - register</title>
    <style>
      main {
        padding: 20px 0px; /*상하 좌우*/
      }
      main h1 {
        text-align: center;
        padding: 5px;
      }

      main form {
        height: 350px;
        border: 1px solid gray;
        padding: 40px;
      }

      main .form-item {
        margin-bottom: 10px;
      }

      main .form-item label {
        display: inline-block;
        width: 150px;
        font-size: 18px;
      }

      main .form-item input {
        font-size: 18px;
        border: 1px skyblue solid;
        width: 200px;
      }

      main form button {
        float: right;
        width: 120px;
        font-size: 18px;
        padding: 5px;
        margin-top: 10px;
      }

      .error-msg {
        color: red;
        font-size: 14px;
        margin-top: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <!-- 5개의 메뉴생성 -->
        <ul>
          <li class="logo">
            <a href="index.html"
              ><img src="images/logo.jpg" alt="로고입니다."
            /></a>
          </li>
          <li><a href="./personal.html">개인</a></li>
          <li><a href="busines.html">기업</a></li>
          <li><a href="login.html">로그인</a></li>
          <li><a href="register.html">회원가입</a></li>
        </ul>
      </nav>
    </header>

    <div id="banner">지금 당신의 행복! IT's KOSTA Life!</div>

    <main>
      <h1>Register</h1>
      <form action="" method="post" novalidate="novalidate" id="registerForm">
        <div class="form-item">
          <label for="name">이름</label>
          <input
            type="text"
            id="name"
            name="name"
            required="required"
            autofocus
          />
          <div class="error-msg" id="nameError">이름을 입력해주세요.</div>
        </div>

        <div class="form-item">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" required />
          <div class="error-msg" id="emailError">이메일을 입력해주세요.</div>
        </div>

        <div class="form-item">
          <label for="phone">연락처</label>
          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="010-0000-0000"
          />
          <div class="error-msg" id="phoneError">
            연락처를 올바르게 입력해주세요. (예: 010-1234-5678)
          </div>
        </div>

        <div class="form-item">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" />
          <div class="error-msg" id="passwordError">
            비밀번호를 입력해주세요.
          </div>
        </div>

        <div class="form-item">
          <label for="password2">비밀번호 확인</label>
          <input type="password" id="password2" name="password2" />
          <div class="error-msg" id="password2Error">
            비밀번호가 일치하지 않습니다.
          </div>
        </div>

        <hr />
        <button type="submit">회원 가입</button>
      </form>
    </main>

    <footer>
      <ul>
        <li>경기도 성남시 오리역 한국소프트웨어진흥협회</li>
        <li>02-0000-0000</li>
      </ul>
    </footer>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          let errors = [];

          const name = document.getElementById("name");
          const email = document.getElementById("email");
          const phone = document.getElementById("phone");
          const password = document.getElementById("password");
          const password2 = document.getElementById("password2");

          // 이름 검사
          if (name.value.trim() === "") {
            errors.push("이름을 입력해주세요.");
          }

          // 이메일 검사 (빈 값 + 형식)
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (email.value.trim() === "") {
            errors.push("이메일을 입력해주세요.");
          } else if (!emailRegex.test(email.value.trim())) {
            errors.push(
              "올바른 이메일 형식이 아닙니다. (예: user@example.com)",
            );
          }

          // 연락처 검사 (입력했을 때만 형식 체크)
          const phoneRegex = /^010-\d{4}-\d{4}$/;
          if (
            phone.value.trim() !== "" &&
            !phoneRegex.test(phone.value.trim())
          ) {
            errors.push("연락처를 올바르게 입력해주세요. (예: 010-1234-5678)");
          }

          // 비밀번호 검사
          if (password.value.trim() === "") {
            errors.push("비밀번호를 입력해주세요.");
          }

          // 비밀번호 확인 검사
          if (password.value !== password2.value) {
            errors.push("비밀번호가 일치하지 않습니다.");
          }

          // 유효성 검사 실패 시 alert 후 제출 막기
          if (errors.length > 0) {
            alert(errors[0]);
            e.preventDefault();
          }
        });
    </script>
  </body>
</html>
