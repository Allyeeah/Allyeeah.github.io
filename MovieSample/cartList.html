<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Insert title here</title>
    <link rel="stylesheet" type="text/css" href="css/basic.css" />
    <style type="text/css">
      .poster {
        width: 150px;
        height: 150px;
      }

      a {
        text-decoration: none;
      }
    </style>

    <script type="text/javascript"></script>
  </head>
  <body>
    <button name="delItem">삭제</button>
    <hr />
    <article class="main">
      <section>
        <table width="80%" align="center">
          <caption class="caption">
            찜 리스트
          </caption>
          <thead>
            <tr>
              <th>이미지</th>
              <th>상품번호</th>
              <th>상품이름</th>
              <th>가격</th>
              <th>삭제</th>
            </tr>
          </thead>
          <tbody id="content">
            <!-- 찜목록 출력 -->
          </tbody>
        </table>
      </section>
      <section class="toalprice" id="price">
        <!-- 가격 -->
      </section>
      <section class="link">
        <table align="center">
          <tr>
            <td align="center">
              <a href="">주문하러 가기</a>
              <a href="index.html">DVD LIST</a>
            </td>
          </tr>
        </table>
      </section>
    </article>

    <script>
      // localstoragte에 저장된 찜 리스트  조회
      function getInfo() {
        let len = localStorage.length;
        let str = "";
        let totalPrice = 0;

        for (let i = 0; i < len; i++) {
          let key = localStorage.key(i);
          let value = localStorage.getItem(key);
          let arr = value.split(",");

          let name = arr[0];
          let img = arr[1];
          let price = parseInt(arr[2]);

          totalPrice += price;
          let priceStr = price.toLocaleString();

          str += "<tr>";
          str += "<td><img class='poster' src='" + img + "'></td>";
          str += "<td>" + key + "</td>";
          str += "<td>" + name + "</td>";
          str += "<td>" + priceStr + "</td>";
          str +=
            "<td><button onclick=\"deleteItem('" +
            key +
            "')\">삭제</button></td>";
          str += "</tr>";
        }
        document.getElementById("content").innerHTML = str;
        document.getElementById("price").innerHTML =
          "<h5>주문가격 : " + totalPrice.toLocaleString() + "원</h5>";
      }

      function deleteItem(key) {
        localStorage.removeItem(key);
        alert("정말 삭제하시겠습니까?");
        getInfo();
      }

      getInfo();
    </script>
  </body>
</html>
